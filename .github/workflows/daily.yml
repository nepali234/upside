name: Daily job refresh

on:
  schedule:
    - cron: "36 13 * * *"   # 13:36 UTC = 6:36am Seattle in summer, 5:36am in winter
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write            # needed to commit the updated jobs.json

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover tests

      - name: Check job boards
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # optional: phone alerts via the free ntfy app
        run: python scraper.py

      - name: Save results
        run: |
          git config user.name "upside-radar-bot"
          git config user.email "upside-radar-bot@users.noreply.github.com"
          git add docs/jobs.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Job refresh $(date -u +%Y-%m-%d)"
            git push
          fi
